<header class="lp-header">
  <div class="lp-header-inner">
    <a class="lp-brand" href="/" title="Ir a inicio">WARY - U</a>
    <nav class="lp-nav">
    </nav>
    <div class="lp-app-badges">
    </div>
  </div>
</header>
<div class="container">
  <div class="login-box">
    <h2>¡Bienvenido!</h2>
    <br>
    <input
      type="text"
      class="custom-input"
      placeholder="Usuario"
      [(ngModel)]="username"
    />
    <br />

    <input
      type="password"
      class="custom-input"
      placeholder="Contraseña"
      [(ngModel)]="password"
    />
    <br>
    <br>
    <button class="custom-button" (click)="login()">
      Iniciar sesión
    </button>
  </div>
</div>
