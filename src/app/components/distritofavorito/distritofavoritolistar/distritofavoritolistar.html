<div class="container">
  <div style="text-align: center;margin:5%"><h2>Lista de Distritos Favoritos de Usuarios</h2></div>
  <div>
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

      <!-- Position Column -->
      <ng-container matColumnDef="c1">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let element"> {{element.id_DistritoFavorito}} </td>
      </ng-container>
      <!-- Name Column -->

      <ng-container matColumnDef="c2">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let element"> {{element.estado}} </td>
      </ng-container>

      
      <ng-container matColumnDef="cf">
        <th mat-header-cell *matHeaderCellDef>Usuario</th>
        <td mat-cell *matCellDef="let element"> {{element.usuario.nombreUsuario}} </td>
      </ng-container>

         <ng-container matColumnDef="cfk">
        <th mat-header-cell *matHeaderCellDef>Distrito</th>
        <td mat-cell *matCellDef="let element"> {{element.distrito.nombre}} </td>
      </ng-container>
                 <!-- Symbol Column -->
                 <ng-container matColumnDef="c3">
                  <th mat-header-cell *matHeaderCellDef>Actualizar</th>
                  <td mat-cell *matCellDef="let element">
                    <button
                    matButton
                    [routerLink]="['edits',element.id_DistritoFavorito]">
                      <mat-icon>edit</mat-icon>
                    </button>
                  </td>
                </ng-container>

                <ng-container matColumnDef="c4">
                  <th mat-header-cell *matHeaderCellDef>Eliminar</th>
                  <td mat-cell *matCellDef="let element">
                    <button
                    matButton
                    (click)="eliminar(element.id_DistritoFavorito)" 
                    >
                      <mat-icon>delete</mat-icon>
                    </button>
                  </td>
                </ng-container>
                
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [pageSize]="5"
                   [pageSizeOptions]="[5, 10, 20]"
                   showFirstLastButtons>
    </mat-paginator>
    
  </div>
</div>
