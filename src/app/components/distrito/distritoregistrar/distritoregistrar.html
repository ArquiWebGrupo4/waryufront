<div class="container">
  @if (edicion) {
    <div style="text-align: center; margin: 5%"><h2>Actualización de Distritos</h2></div>
  }
  @else {
    <div style="text-align: center; margin: 5%"><h2>Registro de Distritos</h2></div>
  }
  
  <div style="text-align: center; margin: 5%">
    <form [formGroup]="form" (submit)="aceptar()">
      @if(edicion){
      <mat-form-field>
        <mat-label>ID</mat-label>
        <input matInput formControlName="codigo" />
        <mat-error>
          @if (form.get('codigo')?.hasError('required')) { Ingrese id del distrito!! }
        </mat-error>
      </mat-form-field>
      }

      <br />
      <mat-form-field>
        <mat-label>Distrito</mat-label>
        <input matInput formControlName="nombre" />
        <mat-error>
          @if (form.get('nombre')?.hasError('required')) { Ingrese nombre del distrito!! }
        </mat-error>
      </mat-form-field>
      <div>
        @if(edicion){
        <button matButton="elevated">Actualizar</button>
        }
        @else{
            <button matButton="elevated">Registrar</button>
         }
      </div>
    </form>
  </div>
</div>
