<div class="container">
    <div style="text-align: center; margin:5%"><h2>Lista de Reportes de Incidentes</h2></div>
    <div>
        <table mat-table [dataSource]=" datasource" class="mat-elevation-z8">

      <!-- Position Column -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let element"> {{element.ID_Reporte}} </td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="descripcion">
        <th mat-header-cell *matHeaderCellDef> Descripcion </th>
        <td mat-cell *matCellDef="let element"> {{element.Descripcion}} </td>
      </ng-container>

      <!-- Date Column -->
      <ng-container matColumnDef="fecha">
        <th mat-header-cell *matHeaderCellDef> Fecha </th>
        <td mat-cell *matCellDef="let element"> {{element.Fecha}} </td>
      </ng-container>

      <!-- ID Incidente Column -->
      <ng-container matColumnDef="id_incidente">
        <th mat-header-cell *matHeaderCellDef> Incidente </th>
        <td mat-cell *matCellDef="let element"> {{element.ID_Incidente}} </td>
      </ng-container>

      <!-- ID Incidente Column -->
      <ng-container matColumnDef="id_usuario">
        <th mat-header-cell *matHeaderCellDef> Usuario </th>
        <td mat-cell *matCellDef="let element"> {{element.usuario.ID_Usuario}} </td>
      </ng-container>

      <!-- Symbol Columns -->
                 <ng-container matColumnDef="ce">
                  <th mat-header-cell *matHeaderCellDef> Actualizar </th>
                  <td mat-cell *matCellDef="let element">
                    <button
                    matButton
                    [routerLink]="['edits',element.ID_Reporte]">
                      <mat-icon>edit</mat-icon>Actualizar
                    </button>
                  </td>
                </ng-container>

                <ng-container matColumnDef="cd">
                  <th mat-header-cell *matHeaderCellDef> Eliminar </th>
                  <td mat-cell *matCellDef="let element">
                    <button
                    matButton
                    (click)="eliminar(element.ID_Reporte)"
                    >
                      <mat-icon>delete</mat-icon>Eliminar
                    </button>
                  </td>
                </ng-container>




                 
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>



    </div>



</div>
