<div class="container">
  <div style="text-align: center; margin:5%">
    <h2>Lista de Reportes de Incidentes</h2>
  </div>

  <div>
    <table mat-table [dataSource]="datasource" class="mat-elevation-z8">

      <!-- Columna ID -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let element"> {{element.id_Reporte}} </td>
      </ng-container>
      
      <!-- Columna Usuario -->
      <ng-container matColumnDef="id_Usuario">
        <th mat-header-cell *matHeaderCellDef> Usuario </th>
        <td mat-cell *matCellDef="let element"> {{element.usuario.nombreUsuario}} </td>
      </ng-container>

      <!-- Columna Incidente -->
      <ng-container matColumnDef="id_Incidente">
        <th mat-header-cell *matHeaderCellDef> Incidente </th>
        <td mat-cell *matCellDef="let element"> {{element.incidente.descripcion}} </td>
      </ng-container>

      <!-- Columna Descripción -->
      <ng-container matColumnDef="descripcion">
        <th mat-header-cell *matHeaderCellDef> Descripción </th>
        <td mat-cell *matCellDef="let element"> {{element.descripcion}} </td>
      </ng-container>

      <!-- Columna Fecha -->
      <ng-container matColumnDef="fecha">
        <th mat-header-cell *matHeaderCellDef> Fecha de Registro </th>
        <td mat-cell *matCellDef="let element">
          {{ element.fecha | date:'dd/MM/yyyy HH:mm:ss' }}
        </td> 
      </ng-container>

      <!-- Columna Actualizar -->
      <ng-container matColumnDef="ce">
        <th mat-header-cell *matHeaderCellDef> Actualizar </th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button [routerLink]="['edits', element.id_Reporte]">
            <mat-icon>edit</mat-icon>
          </button>
        </td>
      </ng-container>

      <!-- Columna Eliminar -->
      <ng-container matColumnDef="cd">
        <th mat-header-cell *matHeaderCellDef> Eliminar </th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button (click)="eliminar(element.id_Reporte)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>


      <!-- Filas -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <!-- 🔹 Paginador -->
    <mat-paginator [pageSize]="5"
                   [pageSizeOptions]="[5, 10, 20]"
                   showFirstLastButtons>
    </mat-paginator>
  </div>
</div>
