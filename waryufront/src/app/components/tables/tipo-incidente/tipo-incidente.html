<div class="container">
    <div style="text-align: center; margin:5%">
        <h2>
        Tipos de Incidentes
        </h2>
    </div>
    <div>
        <form [formGroup]="form" (submit)="aceptar()">
            <mat-form-field>
  <mat-label>Tipo</mat-label>
  <input matInput formControlName="tipo" />
  <mat-error> @if (form.get('tipo')?.hasError('required')) { Ingrese Tipo de Incidente!! } </mat-error>
</mat-form-field>

        </form>
    </div>
    
</div>
